name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job opts into id-token below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stub bundled UI
        # The real UI is built in the `build` job. Tests don't need it, but the
        # wheel/editable build force-includes ui/dist and the server mounts
        # ui/dist/assets when present — so create a minimal placeholder here.
        run: |
          mkdir -p ui/dist/assets
          printf '<!doctype html><title>ragzero</title>' > ui/dist/index.html
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,all]"
      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
      - name: Build Python package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Only on a tagged release (v0.1.0, v0.2.0, ...) from this repo — never forks.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'aasu14/ragzero'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing (no API token needed)
    environment:
      name: pypi
      url: https://pypi.org/p/ragzero
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
