# Production configuration — sentence-transformers + FAISS + Anthropic
pipeline:
  retriever_k: 100
  final_k: 15
  chunk_size: 1000
  chunk_overlap: 150
  max_context_chunks: 10
  max_tokens: 1024

confidence:
  half_life_days: 180.0
  default_source_quality: 0.5
  source_quality:
    "https://gov.": 0.95
    "internal://verified/": 0.95
    "internal://": 0.85
    "https://docs.": 0.8
  w_freshness: 0.30
  w_source: 0.40
  w_consistency: 0.30
  aggregate_top_n: 7

fallback:
  min_aggregate_confidence: 0.65
  min_chunks: 2
  require_min_citations: 2
  min_top_retrieval_score: 0.0

cache:
  query_ttl_seconds: 1800
  max_entries: 100000

backends:
  embedder: sentence_transformers
  embedder_settings:
    model: sentence-transformers/all-MiniLM-L6-v2
  vector_store: faiss
  vector_store_settings:
    M: 32
  keyword_index: bm25
  llm: anthropic
  llm_model: claude-opus-4-7
  tracer: logging
